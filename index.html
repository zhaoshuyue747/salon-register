<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阳光出海·合规无忧 — 沙龙报名</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #0f1937 0%, #050f28 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 0;
  }
  /* Header */
  .header {
    text-align: center;
    padding: 40px 0 30px;
  }
  .header .diamonds {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .header .diamond {
    width: 10px; height: 10px;
    background: #d4af37;
    transform: rotate(45deg);
  }
  .header h1 {
    font-size: 28px;
    color: #d4af37;
    line-height: 1.4;
    letter-spacing: 1px;
  }
  .header .subtitle {
    font-size: 15px;
    color: #a0b4d0;
    margin-top: 10px;
    letter-spacing: 2px;
  }
  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 10px 0 30px;
  }
  .divider .line { flex: 1; height: 1px; background: rgba(255,255,255,0.15); }
  .divider .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #d4af37; flex-shrink: 0;
  }
  /* Form */
  .form-card {
    background: rgba(22, 35, 70, 0.9);
    border: 1px solid rgba(60, 100, 160, 0.3);
    border-radius: 16px;
    padding: 30px 24px;
  }
  .form-card h2 {
    font-size: 18px;
    color: #d4af37;
    margin-bottom: 24px;
    text-align: center;
    letter-spacing: 1px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    color: #c8d6e5;
    margin-bottom: 6px;
  }
  .form-group label .required {
    color: #e74c3c;
    margin-left: 2px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid rgba(100, 140, 200, 0.3);
    border-radius: 8px;
    background: rgba(15, 25, 50, 0.8);
    color: #fff;
    outline: none;
    transition: border-color 0.3s;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus {
    border-color: #d4af37;
  }
  .form-group input::placeholder {
    color: rgba(180, 200, 220, 0.4);
  }
  .form-group select option {
    background: #0f1937;
    color: #fff;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #0f1937;
    background: linear-gradient(135deg, #d4af37, #c99b2a);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 2px;
    margin-top: 10px;
    transition: opacity 0.3s, transform 0.2s;
    font-family: inherit;
  }
  .btn-submit:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .btn-submit:active {
    transform: translateY(0);
  }
  /* Success */
  .success-msg {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-msg .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .success-msg h3 {
    font-size: 22px;
    color: #d4af37;
    margin-bottom: 12px;
  }
  .success-msg p {
    font-size: 15px;
    color: #a0b4d0;
    line-height: 1.6;
  }
  /* Footer */
  .footer {
    text-align: center;
    padding: 30px 0;
    font-size: 13px;
    color: rgba(150, 170, 200, 0.6);
  }
  /* Responsive */
  @media (max-width: 480px) {
    .header h1 { font-size: 22px; }
    .form-card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="diamonds">
      <div class="diamond"></div>
      <div class="diamond"></div>
      <div class="diamond"></div>
    </div>
    <h1>阳光出海 · 合规无忧<br>企业退税不愁</h1>
    <p class="subtitle">—— 跨境电商出口退税专题沙龙 ——</p>
  </div>

  <div class="divider">
    <span class="line"></span><span class="dot"></span><span class="line"></span>
  </div>

  <!-- Form -->
  <div class="form-card" id="formCard">
    <h2>参会报名</h2>
    <form id="regForm">
      <div class="form-group">
        <label>企业名称 <span class="required">*</span></label>
        <input type="text" id="company" placeholder="请输入企业全称" required>
      </div>
      <div class="form-group">
        <label>参会人姓名 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="请输入姓名" required>
      </div>
      <div class="form-group">
        <label>手机号码 <span class="required">*</span></label>
        <input type="tel" id="phone" placeholder="请输入手机号码" required pattern="1[3-9]\d{9}">
      </div>
      <div class="form-group">
        <label>职务</label>
        <input type="text" id="title" placeholder="如：总经理 / 财务总监 / 运营主管">
      </div>
      <div class="form-group">
        <label>参会人数</label>
        <select id="attendees">
          <option value="1">1人</option>
          <option value="2">2人</option>
          <option value="3">3人</option>
          <option value="4">4人</option>
          <option value="5+">5人以上</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">提 交 报 名</button>
    </form>
  </div>

  <!-- Success -->
  <div class="success-msg" id="successMsg">
    <div class="icon">✅</div>
    <h3>报名提交成功！</h3>
    <p>感谢您的参与，我们将在会前通过短信/电话与您确认席位。</p>
    <p style="margin-top:10px;font-size:13px;">如有疑问，请联系东莞市橙辉供应链管理有限公司</p>
  </div>

  <div class="footer">
    东莞市橙辉供应链管理有限公司 · 诚邀莅临
  </div>
</div>

<script>
  document.getElementById('regForm').addEventListener('submit', function(e) {
    e.preventDefault();
    // Collect data
    var data = {
      company: document.getElementById('company').value.trim(),
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      title: document.getElementById('title').value.trim(),
      attendees: document.getElementById('attendees').value,
      time: new Date().toISOString()
    };
    // Save to localStorage as backup
    var records = JSON.parse(localStorage.getItem('salon_registrations') || '[]');
    records.push(data);
    localStorage.setItem('salon_registrations', JSON.stringify(records));
    // Show success
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  });
</script>
</body>
</html>
